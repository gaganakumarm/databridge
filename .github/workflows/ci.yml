name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: databridge_test
          POSTGRES_USER: databridge
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U databridge -d databridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABRIDGE_TEST_DATABASE_URL: postgresql+psycopg://databridge:local-ci-only@127.0.0.1:5432/databridge_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests migrations
      - run: python -m alembic upgrade head
        env:
          DATABRIDGE_DATABASE_URL: ${{ env.DATABRIDGE_TEST_DATABASE_URL }}
      - run: python -m alembic check
        env:
          DATABRIDGE_DATABASE_URL: ${{ env.DATABRIDGE_TEST_DATABASE_URL }}
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
